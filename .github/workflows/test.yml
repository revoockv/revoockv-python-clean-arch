# The self-check of the skill on every push to main/develop and every pull request.
name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/templates.py validate --all
      - run: python scripts/selfcheck.py
